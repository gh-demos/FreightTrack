<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FreightTrack Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eaf1f5;
      --paper: #ffffff;
      --ink: #122130;
      --muted: #556679;
      --line: #d4e0ea;
      --brand: #0f6f7f;
      --brand-soft: #e7f4f6;
      --ok: #198754;
      --err: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Albert Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 480px at 110% -10%, #cde4ef 0%, transparent 65%),
        radial-gradient(600px 280px at -10% -20%, #d8f0e2 0%, transparent 70%),
        var(--bg);
    }

    .shell {
      max-width: 1200px;
      margin: 28px auto;
      padding: 0 20px 28px;
    }

    .topbar {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 18px 40px rgba(12, 38, 55, 0.12);
    }

    .title {
      margin: 0;
      font-size: 29px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .status {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--line);
      background: #fff;
      white-space: nowrap;
    }

    .status.ok { color: var(--ok); border-color: #bde3d0; background: #f1faf5; }
    .status.err { color: var(--err); border-color: #f3b9b3; background: #fff5f4; }

    .nav {
      margin-top: 14px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      box-shadow: 0 10px 22px rgba(12, 38, 55, 0.08);
    }

    .tab {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: #26415f;
      background: transparent;
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease, transform 140ms ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .tab:hover { background: #edf3fb; transform: translateY(-1px); }
    .tab.active { background: var(--brand-soft); color: var(--brand); font-weight: 700; }

    .tab svg { opacity: 0.86; }

    .tab-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tab-bubble {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      padding: 0 6px;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 4px 10px rgba(220, 38, 38, 0.35);
      line-height: 1;
    }

    .tab.active .tab-bubble {
      background: linear-gradient(135deg, #0f6f7f 0%, #13879a 100%);
      box-shadow: 0 4px 10px rgba(15, 111, 127, 0.35);
    }

    .panel {
      margin-top: 14px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(12, 38, 55, 0.12);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .panel-title {
      margin: 0;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.01em;
    }

    .panel-title-icon {
      width: 18px;
      height: 18px;
      color: var(--brand);
    }

    .panel-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .simulation-meta {
      margin-top: 4px;
      color: #3b5679;
      font-size: 12px;
      font-weight: 600;
    }

    .shipment-tools {
      display: none;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .shipment-tools.visible { display: flex; }

    .data-tools {
      display: none;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .data-tools.visible { display: flex; }

    input, select {
      border: 1px solid #bfd0e0;
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 180px;
      font-size: 14px;
      background: #fff;
      font-family: inherit;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 111, 127, 0.15);
    }

    #search-input { min-width: 260px; }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      color: #fff;
      background: linear-gradient(135deg, var(--brand) 0%, #13879a 100%);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .btn.secondary { background: #5f7186; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }

    .metric-name {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    .metric-value {
      margin: 6px 0 0;
      font-size: 26px;
      font-weight: 700;
      color: #243a57;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
      font-size: 14px;
    }

    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #ecf1f8;
      vertical-align: top;
      max-width: 320px;
      overflow-wrap: break-word;
    }

    th {
      background: #f8fbff;
      position: sticky;
      top: 0;
      font-size: 12px;
      color: #355073;
      font-weight: 700;
      text-transform: none;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    tr:hover td { background: #fafcff; }

    .muted { color: var(--muted); }
    .empty {
      border: 1px dashed #c7d7eb;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: var(--muted);
      background: #fbfdff;
    }

    .pager {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pager .btn {
      padding: 8px 10px;
      font-size: 13px;
    }

    .btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-green { background: #edf9f1; color: #1e7b47; border-color: #bde3cf; }
    .badge-blue { background: #eaf3ff; color: #1f5fa6; border-color: #bfd7f5; }
    .badge-amber { background: #fff7e8; color: #946200; border-color: #f0dbad; }
    .badge-red { background: #fff2f1; color: #b42318; border-color: #f2b6b1; }
    .badge-slate { background: #f2f5f9; color: #42536b; border-color: #d6e0ec; }

    .btn.tiny {
      padding: 6px 9px;
      font-size: 12px;
      border-radius: 8px;
      width: auto;
    }

    @media (max-width: 760px) {
      .title { font-size: 22px; }
      input, select { min-width: 180px; width: 100%; }
      #search-input { min-width: 180px; }
      .data-tools { width: 100%; }
      .shipment-tools { width: 100%; }
      .btn { width: 100%; }
      .tab { flex: 1 1 calc(50% - 8px); text-align: center; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1 class="title">FreightTrack</h1>
        <p class="subtitle">Operations Console</p>
      </div>
      <div id="status" class="status">Checking service...</div>
    </header>

    <nav class="nav" id="nav"></nav>

    <section class="panel">
      <div class="toolbar">
        <div>
          <h2 class="panel-title" id="panel-title">Overview</h2>
          <div class="panel-meta" id="panel-meta">Loading latest data...</div>
          <div class="simulation-meta" id="simulation-meta">Last simulation run: Never</div>
        </div>

        <div class="data-tools" id="data-tools">
          <input id="search-input" placeholder="Search..." />
          <select id="status-filter"></select>
          <select id="sort-field"></select>
          <select id="sort-dir">
            <option value="desc">Newest First</option>
            <option value="asc">Oldest First</option>
          </select>
          <select id="page-size">
            <option value="10">10 / page</option>
            <option value="25">25 / page</option>
            <option value="50">50 / page</option>
          </select>
          <button class="btn" id="apply-filters">Apply</button>
        </div>

        <div class="shipment-tools" id="shipment-tools">
          <input id="tracking" placeholder="Search by tracking number" />
          <button class="btn" id="find-btn">Find Shipment</button>
          <button class="btn secondary" id="all-btn">Show All</button>
          <button class="btn secondary" id="simulate-btn">Simulate 5h Intake</button>
        </div>
      </div>

      <div class="cards" id="cards"></div>
      <div id="content"></div>
      <div class="pager" id="pager"></div>
    </section>
  </div>

  <script>
    const api = 'http://localhost:8080/api';

    const sections = [
      { id: 'overview', label: 'Overview' },
      { id: 'shipments', label: 'Shipments', path: 'shipments' },
      { id: 'customers', label: 'Customers', path: 'customers' },
      { id: 'tracking-events', label: 'Tracking Events', path: 'tracking-events' },
      { id: 'drivers', label: 'Drivers', path: 'drivers' },
      { id: 'routes', label: 'Delivery Routes', path: 'routes' },
      { id: 'shipping-exceptions', label: 'Exceptions/Delays', path: 'shipping-exceptions' },
      { id: 'notifications', label: 'Notifications', path: 'notifications' }
    ];

    const sectionIcons = {
      overview: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>',
      shipments: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="3" width="15" height="13"></rect><path d="M16 8h4l3 3v5h-7z"></path><circle cx="5.5" cy="18.5" r="1.5"></circle><circle cx="18.5" cy="18.5" r="1.5"></circle></svg>',
      customers: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><path d="M20 8v6"></path><path d="M23 11h-6"></path></svg>',
      'tracking-events': '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="m7 15 4-4 3 3 5-6"></path></svg>',
      drivers: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20a8 8 0 0 1 16 0"></path></svg>',
      routes: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="6" r="3"></circle><path d="M8.7 15.3 15.3 8.7"></path></svg>',
      'shipping-exceptions': '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
      notifications: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>'
    };

    const nav = document.getElementById('nav');
    const statusEl = document.getElementById('status');
    const panelTitle = document.getElementById('panel-title');
    const panelMeta = document.getElementById('panel-meta');
    const simulationMeta = document.getElementById('simulation-meta');
    const cards = document.getElementById('cards');
    const content = document.getElementById('content');
    const pager = document.getElementById('pager');

    const dataTools = document.getElementById('data-tools');
    const searchInput = document.getElementById('search-input');
    const statusFilter = document.getElementById('status-filter');
    const sortField = document.getElementById('sort-field');
    const sortDir = document.getElementById('sort-dir');
    const pageSize = document.getElementById('page-size');
    const applyFilters = document.getElementById('apply-filters');

    const shipmentTools = document.getElementById('shipment-tools');
    const trackingInput = document.getElementById('tracking');
    const findBtn = document.getElementById('find-btn');
    const allBtn = document.getElementById('all-btn');
    const simulateBtn = document.getElementById('simulate-btn');

    let activeSection = 'overview';
    const cache = {};
    let unreadNotificationCount = 0;
    const AUTO_REFRESH_MS = 30_000;
    let isRefreshing = false;

    const pageableSections = new Set(['shipments', 'customers']);
    const columnConfig = {
      shipments: [
        { key: 'trackingNumber', label: 'Tracking Number' },
        { key: 'customerName', label: 'Customer' },
        { key: 'origin', label: 'Origin' },
        { key: 'destination', label: 'Destination' },
        { key: 'status', label: 'Status' },
        { key: 'pickupDate', label: 'Pickup Date' },
        { key: 'expectedDeliveryDate', label: 'Expected Delivery' },
        { key: 'actualDeliveryDate', label: 'Actual Delivery' },
        { key: 'weight', label: 'Weight' },
        { key: 'value', label: 'Value' },
        { key: 'currency', label: 'Currency' },
        { key: 'createdAt', label: 'Created At' }
      ],
      customers: [
        { key: 'name', label: 'Name' },
        { key: 'email', label: 'Email' },
        { key: 'phone', label: 'Phone' },
        { key: 'city', label: 'City' },
        { key: 'state', label: 'State' },
        { key: 'active', label: 'Active' },
        { key: 'createdAt', label: 'Created At' }
      ]
    };

    const sectionState = Object.fromEntries(
      sections
        .filter((s) => s.path)
        .map((s) => [
          s.id,
          {
            q: '',
            status: '',
            sort: 'createdAt',
            dir: 'desc',
            page: 0,
            size: 10,
            totalPages: 1,
            totalElements: 0
          }
        ])
    );

    const sortOptions = {
      shipments: [
        ['createdAt', 'Created At'],
        ['trackingNumber', 'Tracking Number'],
        ['status', 'Status'],
        ['pickupDate', 'Pickup Date'],
        ['expectedDeliveryDate', 'Expected Delivery']
      ],
      customers: [
        ['createdAt', 'Created At'],
        ['name', 'Name'],
        ['email', 'Email'],
        ['city', 'City']
      ]
    };

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function formatDateLike(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return escapeHtml(value);
      return escapeHtml(date.toLocaleString());
    }

    function badge(text, cls) {
      return '<span class="status-badge ' + cls + '">' + escapeHtml(text) + '</span>';
    }

    function statusBadge(value) {
      const key = String(value || '').toUpperCase();
      if (['DELIVERED', 'ACTIVE', 'READ', 'AVAILABLE', 'RESOLVED', 'COMPLETED'].includes(key)) return badge(value, 'badge-green');
      if (['IN_TRANSIT', 'OUT_FOR_DELIVERY', 'SHIPPED', 'ON_DUTY', 'SENT'].includes(key)) return badge(value, 'badge-blue');
      if (['PENDING', 'PICKED_UP', 'IN_PROGRESS'].includes(key)) return badge(value, 'badge-amber');
      if (['FAILED', 'CANCELLED', 'RETURNED', 'OPEN', 'ESCALATED', 'INACTIVE'].includes(key)) return badge(value, 'badge-red');
      return badge(value, 'badge-slate');
    }

    function formatValue(key, value, row) {
      if (value === null || value === undefined || value === '') return '<span class="muted">-</span>';

      if (typeof value === 'boolean') {
        return value ? badge('Yes', 'badge-green') : badge('No', 'badge-slate');
      }

      const k = String(key || '').toLowerCase();
      if (k.includes('status')) {
        return statusBadge(value);
      }

      if (k.includes('date') || k.endsWith('at') || k.includes('time')) {
        return formatDateLike(value);
      }

      if (k === 'value' && row && row.currency) {
        const num = Number(value);
        if (!Number.isNaN(num)) {
          return escapeHtml(new Intl.NumberFormat(undefined, { style: 'currency', currency: row.currency }).format(num));
        }
      }

      if (typeof value === 'object') return '<span class="muted">[object]</span>';
      return escapeHtml(value);
    }

    function formatHeaderLabel(key) {
      return key
        .replaceAll('_', ' ')
        .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/^./, (c) => c.toUpperCase());
    }

    function renderNav() {
      nav.innerHTML = sections.map(section => {
        const activeClass = section.id === activeSection ? 'tab active' : 'tab';
        const icon = sectionIcons[section.id] || sectionIcons.overview;
        const bubble = section.id === 'notifications' && unreadNotificationCount > 0
          ? '<span class="tab-bubble">' + escapeHtml(formatBubbleCount(unreadNotificationCount)) + '</span>'
          : '';
        return '<button class="' + activeClass + '" data-id="' + section.id + '">' + icon + '<span class="tab-label"><span>' + escapeHtml(section.label) + '</span>' + bubble + '</span></button>';
      }).join('');

      nav.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => setSection(button.getAttribute('data-id')));
      });
    }

    function formatBubbleCount(count) {
      if (count > 99) return '99+';
      return String(count);
    }

    function getUnreadNotificationsCount(rows) {
      if (!Array.isArray(rows)) return 0;
      return rows.filter((row) => {
        const status = String(row?.status || '').toUpperCase();
        return status !== 'READ' || !row?.readAt;
      }).length;
    }

    async function refreshNotificationsBubble() {
      try {
        const rows = await fetchResource('notifications');
        cache.notifications = rows;
        unreadNotificationCount = getUnreadNotificationsCount(rows);
      } catch (_error) {
        unreadNotificationCount = 0;
      }

      renderNav();
    }

    function setSimulationMeta(message) {
      simulationMeta.textContent = message;
    }

    function simulationTimestampLabel() {
      return 'Last simulation run: ' + new Date().toLocaleString();
    }

    function renderCards(counts) {
      const entries = [
        ['Shipments', counts['shipments'] || 0],
        ['Customers', counts['customers'] || 0],
        ['Tracking Events', counts['tracking-events'] || 0],
        ['Drivers', counts['drivers'] || 0],
        ['Routes', counts['routes'] || 0],
        ['Exceptions', counts['shipping-exceptions'] || 0],
        ['Notifications', counts['notifications'] || 0]
      ];

      cards.innerHTML = entries.map(([name, value]) =>
        '<article class="metric"><p class="metric-name">' + name + '</p><p class="metric-value">' + value + '</p></article>'
      ).join('');
    }

    function renderTable(sectionId, sectionLabel, rows, columns) {
      if (!Array.isArray(rows) || rows.length === 0) {
        content.innerHTML = '<div class="empty">No records available in ' + escapeHtml(sectionLabel) + '.</div>';
        return;
      }

      const headers = Array.isArray(columns) && columns.length > 0
        ? columns.map((col) => col.key)
        : Array.from(
            rows.reduce((set, row) => {
              Object.keys(row || {}).forEach(k => set.add(k));
              return set;
            }, new Set())
          );

      const headerLabel = (key) => {
        if (!columns) return formatHeaderLabel(key);
        const match = columns.find((col) => col.key === key);
        return match ? match.label : formatHeaderLabel(key);
      };

      const head = headers.map(h => '<th title="' + escapeHtml(h) + '">' + escapeHtml(headerLabel(h)) + '</th>').join('');
      const isShipmentSection = sectionId === 'shipments';
      const body = rows.map(row => {
        const cells = headers.map(h => '<td>' + formatValue(h, row[h], row) + '</td>').join('');
        const actionCell = isShipmentSection
          ? '<td>' + shipmentActionButton(row) + '</td>'
          : '';
        return '<tr>' + cells + actionCell + '</tr>';
      }).join('');

      const actionHead = isShipmentSection ? '<th>Action</th>' : '';

      content.innerHTML =
        '<div class="table-wrap"><table><thead><tr>' + head + actionHead + '</tr></thead><tbody>' + body + '</tbody></table></div>';

      if (isShipmentSection) {
        content.querySelectorAll('.mark-shipped').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const id = Number(btn.getAttribute('data-id'));
            if (!Number.isNaN(id)) {
              await markShipmentShipped(id);
            }
          });
        });
      }
    }

    function shipmentActionButton(row) {
      if (!row || row.id == null) return '<span class="muted">-</span>';
      const status = String(row.status || '').toUpperCase();
      if (['DELIVERED', 'CANCELLED', 'RETURNED', 'SHIPPED'].includes(status)) {
        return '<span class="muted">No action</span>';
      }
      return '<button class="btn tiny mark-shipped" data-id="' + escapeHtml(row.id) + '">Mark Shipped</button>';
    }

    async function fetchResource(pathWithQuery) {
      const response = await fetch(api + '/' + pathWithQuery);
      if (!response.ok) throw new Error('Request failed');
      return response.json();
    }

    async function fetchCount(path) {
      if (pageableSections.has(path)) {
        const page = await fetchResource(path + '?page=0&size=1');
        if (page && typeof page.totalElements === 'number') {
          return page.totalElements;
        }
      }

      const data = await fetchResource(path);
      if (Array.isArray(data)) return data.length;
      if (data && Array.isArray(data.content)) return data.totalElements ?? data.content.length;
      return data ? 1 : 0;
    }

    function renderPager(sectionId) {
      const state = sectionState[sectionId];
      if (!state) {
        pager.innerHTML = '';
        return;
      }

      const current = state.page + 1;
      const totalPages = Math.max(state.totalPages || 1, 1);

      pager.innerHTML =
        '<div class="muted">Page ' + current + ' of ' + totalPages + ' | ' + (state.totalElements || 0) + ' records</div>' +
        '<div>' +
        '<button class="btn secondary" id="prev-page" ' + (state.page <= 0 ? 'disabled' : '') + '>Previous</button> ' +
        '<button class="btn secondary" id="next-page" ' + (state.page >= totalPages - 1 ? 'disabled' : '') + '>Next</button>' +
        '</div>';

      const prev = document.getElementById('prev-page');
      const next = document.getElementById('next-page');

      if (prev) {
        prev.addEventListener('click', async () => {
          if (state.page > 0) {
            state.page -= 1;
            await loadSection(sectionId);
          }
        });
      }

      if (next) {
        next.addEventListener('click', async () => {
          if (state.page < totalPages - 1) {
            state.page += 1;
            await loadSection(sectionId);
          }
        });
      }
    }

    function renderDataTools(sectionId, rows) {
      if (sectionId === 'overview') {
        dataTools.classList.remove('visible');
        statusFilter.style.display = 'none';
        return;
      }

      const state = sectionState[sectionId];
      if (!state) {
        dataTools.classList.remove('visible');
        statusFilter.style.display = 'none';
        return;
      }

      dataTools.classList.add('visible');
      searchInput.value = state.q ?? '';
      pageSize.value = String(state.size ?? 10);
      sortDir.value = state.dir ?? 'desc';

      let options = sortOptions[sectionId] || [];
      if (options.length === 0 && Array.isArray(rows) && rows.length > 0) {
        options = Object.keys(rows[0]).map((k) => [k, formatHeaderLabel(k)]);
      }
      if (options.length === 0) {
        options = [['createdAt', 'Created At']];
      }

      sortField.innerHTML = options
        .map(([value, label]) => '<option value="' + value + '">' + label + '</option>')
        .join('');
      if (!options.find(([value]) => value === state.sort)) {
        state.sort = options[0][0];
      }
      sortField.value = state.sort ?? options[0][0];

      if (sectionId === 'shipments') {
        statusFilter.style.display = 'inline-block';
        statusFilter.innerHTML = [
          '<option value="">All Statuses</option>',
          '<option value="PENDING">Pending</option>',
          '<option value="SHIPPED">Shipped</option>',
          '<option value="PICKED_UP">Picked Up</option>',
          '<option value="IN_TRANSIT">In Transit</option>',
          '<option value="OUT_FOR_DELIVERY">Out For Delivery</option>',
          '<option value="DELIVERED">Delivered</option>',
          '<option value="CANCELLED">Cancelled</option>',
          '<option value="RETURNED">Returned</option>'
        ].join('');
        statusFilter.value = state.status ?? '';
      } else {
        statusFilter.style.display = 'none';
      }
    }

    function normalizeSortValue(value) {
      if (value === null || value === undefined) return '';
      if (typeof value === 'number') return value;
      if (typeof value === 'boolean') return value ? 1 : 0;
      const date = new Date(value);
      if (!Number.isNaN(date.getTime())) return date.getTime();
      return String(value).toLowerCase();
    }

    function applyClientSideOps(sectionId, rows) {
      const state = sectionState[sectionId];
      const query = (state.q || '').trim().toLowerCase();

      let filtered = Array.isArray(rows) ? [...rows] : [];

      if (query) {
        filtered = filtered.filter((row) =>
          Object.values(row || {}).some((value) => String(value ?? '').toLowerCase().includes(query))
        );
      }

      if (sectionId === 'shipments' && state.status) {
        filtered = filtered.filter((row) => String(row?.status || '').toUpperCase() === state.status);
      }

      filtered.sort((a, b) => {
        const av = normalizeSortValue(a?.[state.sort]);
        const bv = normalizeSortValue(b?.[state.sort]);
        if (av < bv) return state.dir === 'asc' ? -1 : 1;
        if (av > bv) return state.dir === 'asc' ? 1 : -1;
        return 0;
      });

      state.totalElements = filtered.length;
      state.totalPages = Math.max(Math.ceil(filtered.length / state.size), 1);
      if (state.page >= state.totalPages) {
        state.page = state.totalPages - 1;
      }

      const start = state.page * state.size;
      const end = start + state.size;
      return filtered.slice(start, end);
    }

    async function loadPageSection(sectionId) {
      const section = sections.find(s => s.id === sectionId);
      const state = sectionState[sectionId];

      const params = new URLSearchParams();
      params.set('page', String(state.page));
      params.set('size', String(state.size));
      params.set('sort', state.sort + ',' + state.dir);
      if (state.q && state.q.trim()) params.set('q', state.q.trim());
      if (sectionId === 'shipments' && state.status) params.set('status', state.status);

      const page = await fetchResource(section.path + '?' + params.toString());
      const rows = Array.isArray(page.content) ? page.content : [];

      state.totalPages = page.totalPages ?? 1;
      state.totalElements = page.totalElements ?? rows.length;
      cache[section.path] = rows;

      cards.innerHTML = '';
      panelMeta.textContent = state.totalElements + ' record(s) found.';
      renderTable(sectionId, section.label, rows, columnConfig[sectionId]);
      renderPager(sectionId);
    }

    async function loadOverview() {
      const paths = sections.filter(s => s.path).map(s => s.path);
      const requests = paths.map(async path => {
        const count = await fetchCount(path);
        return [path, count];
      });

      const counts = Object.fromEntries(await Promise.all(requests));
      renderCards(counts);
      pager.innerHTML = '';
      dataTools.classList.remove('visible');
      shipmentTools.classList.remove('visible');

      const recentPage = await fetchResource('shipments?page=0&size=5&sort=createdAt,desc');
      const preview = Array.isArray(recentPage.content) ? recentPage.content : [];
      panelMeta.textContent = 'Summary of operational data across all modules.';
      renderTable('shipments', 'Recent Shipments', preview, columnConfig.shipments);
    }

    async function loadSection(sectionId) {
      const section = sections.find(s => s.id === sectionId);
      if (!section || !section.path) return;

      const state = sectionState[sectionId];
      if (state) {
        state.size = Number(pageSize.value || state.size || 10);
      }

      if (pageableSections.has(sectionId)) {
        renderDataTools(sectionId, []);
        await loadPageSection(sectionId);
        return;
      }

      const rows = await fetchResource(section.path);
      cache[section.path] = rows;
      renderDataTools(sectionId, rows);

      const pageRows = applyClientSideOps(sectionId, rows);
      cards.innerHTML = '';
      panelMeta.textContent = (sectionState[sectionId].totalElements || pageRows.length) + ' record(s) found.';
      renderTable(sectionId, section.label, pageRows, columnConfig[sectionId]);
      renderPager(sectionId);
    }

    async function findShipment() {
      const tracking = trackingInput.value.trim();
      if (!tracking) {
        panelMeta.textContent = 'Enter a tracking number to search.';
        return;
      }

      const response = await fetch(api + '/shipments/tracking/' + encodeURIComponent(tracking));
      if (!response.ok) {
        panelMeta.textContent = 'No shipment found for tracking number: ' + tracking;
        content.innerHTML = '<div class="empty">No matching shipment.</div>';
        return;
      }

      const item = await response.json();
      cards.innerHTML = '';
      pager.innerHTML = '';
      panelMeta.textContent = 'Showing shipment for tracking number: ' + tracking;
      renderTable('shipments', 'Shipment Search', [item], columnConfig.shipments);
    }

    async function markShipmentShipped(shipmentId) {
      const response = await fetch(api + '/shipments/' + shipmentId + '/status', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'SHIPPED' })
      });

      if (!response.ok) {
        panelMeta.textContent = 'Unable to update shipment status.';
        return;
      }

      panelMeta.textContent = 'Shipment marked as SHIPPED.';
      await loadSection('shipments');
    }

    async function runSimulationNow() {
      const response = await fetch(api + '/shipments/simulation/run', { method: 'POST' });
      if (!response.ok) {
        panelMeta.textContent = 'Simulation failed to run.';
        return;
      }

      const result = await response.json();
      const created = result.createdShipmentTrackingNumber
        ? ' New shipment: ' + result.createdShipmentTrackingNumber + '.'
        : '';
      panelMeta.textContent = 'Simulation completed. Progressed ' + (result.progressedShipments ?? 0) + ' shipment(s).' + created;
      setSimulationMeta(simulationTimestampLabel());

      if (activeSection === 'overview') {
        await loadOverview();
      } else {
        await loadSection(activeSection);
      }
    }

    async function refreshActiveView() {
      if (isRefreshing || document.hidden) {
        return;
      }

      isRefreshing = true;
      try {
        await refreshNotificationsBubble();
        if (activeSection === 'overview') {
          await loadOverview();
        } else {
          await loadSection(activeSection);
        }
      } catch (_error) {
      } finally {
        isRefreshing = false;
      }
    }

    async function setSection(sectionId) {
      activeSection = sectionId;
      renderNav();

      const section = sections.find(s => s.id === sectionId);
      const sectionIcon = sectionIcons[sectionId] || sectionIcons.overview;
      panelTitle.innerHTML = '<span class="panel-title-icon">' + sectionIcon + '</span>' + escapeHtml(section.label);
      shipmentTools.classList.toggle('visible', sectionId === 'shipments');

      try {
        if (sectionId === 'overview') {
          await loadOverview();
        } else {
          await loadSection(sectionId);
        }
      } catch (_error) {
        cards.innerHTML = '';
        panelMeta.textContent = 'Unable to load data at the moment.';
        content.innerHTML = '<div class="empty">Service is currently unavailable.</div>';
      }
    }

    async function initialize() {
      try {
        await fetchResource('shipments?page=0&size=1');
        statusEl.className = 'status ok';
        statusEl.textContent = 'Service Online';
      } catch (_error) {
        statusEl.className = 'status err';
        statusEl.textContent = 'Service Unavailable';
      }

      await refreshNotificationsBubble();
      renderNav();

      applyFilters.addEventListener('click', async () => {
        const state = sectionState[activeSection];
        if (!state) return;
        state.q = searchInput.value.trim();
        state.sort = sortField.value;
        state.dir = sortDir.value;
        state.size = Number(pageSize.value);
        state.page = 0;
        if (activeSection === 'shipments') {
          state.status = statusFilter.value;
        }
        await loadSection(activeSection);
      });

      searchInput.addEventListener('keydown', async (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          applyFilters.click();
        }
      });

      findBtn.addEventListener('click', findShipment);
      simulateBtn.addEventListener('click', runSimulationNow);
      allBtn.addEventListener('click', async () => {
        const state = sectionState.shipments;
        state.q = '';
        state.status = '';
        state.page = 0;
        if (activeSection !== 'shipments') {
          await setSection('shipments');
        } else {
          await loadSection('shipments');
        }
      });
      trackingInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          findShipment();
        }
      });

      window.setInterval(() => {
        refreshActiveView();
      }, AUTO_REFRESH_MS);

      setSection('overview');
    }

    initialize();
  </script>
</body>
</html>
